<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD JS Project</title>

    <!-- 1. Nosso reset primeiro -->
    <link rel="stylesheet" href="styles/reset.css">

    <!-- 2. Bootstrap via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 3. Nosso CSS por último (sobrescreve) -->
    <link rel="stylesheet" href="styles/style.css">
  <script type="module" crossorigin src="/assets/index-BK5Ls_nI.js"></script>
</head>

<body>

    <body>
        <header class="bg-dark text-white py-4 mb-4">
            <h1 class="text-center m-0">PHP/JS CRUD Project</h1>
        </header>

        <main class="container">
            <section class="card p-4 mb-4">
                <h2 class="mb-3">Products</h2>
                <div class="row g-3" id="products"></div>
            </section>

            <section class="card p-4">
                <h2 class="mb-3" id="form-title">Create Product</h2>

                <!-- Alerta de erro (escondido por padrão) -->
                <div id="form-error" class="alert alert-danger d-none" role="alert"></div>

                <form id="create-product-form" class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>

                    <div class="col-md-3">
                        <label for="price" class="form-label">Price</label>
                        <input type="number" class="form-control" id="price" name="price" required>
                    </div>

                    <div class="col-md-1">
                        <label for="estoque" class="form-label">Estoque</label>
                        <input type="number" class="form-control" id="estoque" name="estoque" required>
                    </div>

                    <div class="col-md-3">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="text" class="form-control" id="phone" name="phone" required>
                    </div>

                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-dark flex-fill">Create</button>
                        <button type="button" id="cancel-edit" class="btn btn-outline-secondary"
                            style="display:none;">Cancel</button>
                    </div>
                </form>
            </section>
        </main>

    </body>

</html>
